<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mock Test Page</title>
    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
        }

        .feature-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        .feature-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .feature-desc {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .test-controls {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .control-group input, .control-group select, .control-group textarea {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(45deg, #2591FF, #1976D2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 145, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 145, 255, 0.6);
        }

        .status-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-success { color: #4CAF50; }
        .log-error { color: #F44336; }
        .log-info { color: #2196F3; }
        .log-warning { color: #FF9800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Mock Test Page</h1>
        
        <div class="feature-grid">
            <div class="feature-card" onclick="testWebChannel()">
                <span class="feature-icon">🔗</span>
                <div class="feature-title">WebChannel 测试</div>
                <div class="feature-desc">测试与Python后端的通信</div>
            </div>
            
            <div class="feature-card" onclick="testPerformance()">
                <span class="feature-icon">⚡</span>
                <div class="feature-title">性能测试</div>
                <div class="feature-desc">测试页面加载和响应性能</div>
            </div>
            
            <div class="feature-card" onclick="testStorage()">
                <span class="feature-icon">💾</span>
                <div class="feature-desc">测试本地存储功能</div>
            </div>
            
            <div class="feature-card" onclick="simulateError()">
                <span class="feature-icon">⚠️</span>
                <div class="feature-title">错误处理</div>
                <div class="feature-desc">测试错误处理机制</div>
            </div>
        </div>

        <div class="test-controls">
            <h3>📝 测试控制面板</h3>
            
            <div class="control-group">
                <label>测试消息:</label>
                <input type="text" id="testMessage" value="Hello from Mock Test Page!" placeholder="输入要发送给Python的消息">
            </div>
            
            <div class="control-group">
                <label>测试类型:</label>
                <select id="testType">
                    <option value="ping">Ping测试</option>
                    <option value="data">数据传输测试</option>
                    <option value="async">异步处理测试</option>
                    <option value="error">错误处理测试</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>JSON数据:</label>
                <textarea id="jsonData" rows="3" placeholder='{"key": "value", "number": 123}'></textarea>
            </div>
            
            <div style="text-align: center;">
                <button class="btn" onclick="sendCustomMessage()">📤 发送自定义消息</button>
                <button class="btn" onclick="clearLogs()">🗑️ 清空日志</button>
                <button class="btn" onclick="runAllTests()">🔄 运行所有测试</button>
            </div>
        </div>

        <div class="status-area" id="logArea">
            <div class="log-entry log-info">📋 Mock Test Page 初始化完成</div>
            <div class="log-entry log-info">🕐 等待WebChannel连接...</div>
        </div>
    </div>

    <script>
        'use strict';
        
        // 全局状态
        const mockState = {
            backendInterface: null,
            isChannelReady: false,
            testCounter: 0,
            startTime: Date.now()
        };

        // 日志记录
        function addLog(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logArea.appendChild(logEntry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logArea').innerHTML = '';
            addLog('日志已清空', 'info');
        }

        // WebChannel 初始化
        function initWebChannel() {
            if (!window.qt || !window.qt.webChannelTransport) {
                addLog('❌ QWebChannel传输不可用', 'error');
                return;
            }

            new QWebChannel(qt.webChannelTransport, (channel) => {
                mockState.backendInterface = channel.objects.backendInterface;
                mockState.isChannelReady = true;
                
                const loadTime = Date.now() - mockState.startTime;
                addLog(`✅ WebChannel连接成功 (${loadTime}ms)`, 'success');

                // 通知后端前端就绪
                if (mockState.backendInterface.frontend_ready) {
                    mockState.backendInterface.frontend_ready();
                    addLog('📡 已通知后端前端就绪', 'info');
                }
            });
        }

        // 发送消息到Python
        function sendToPython(action, data = {}) {
            if (!mockState.isChannelReady || !mockState.backendInterface) {
                addLog('❌ 通信通道未就绪', 'error');
                return false;
            }

            try {
                const request = {
                    requestId: `mock_req_${Date.now()}_${++mockState.testCounter}`,
                    action: action,
                    data: data,
                    timestamp: new Date().toISOString()
                };

                addLog(`📤 发送: ${action}`, 'info');
                
                if (mockState.backendInterface.dispatch_request) {
                    mockState.backendInterface.dispatch_request(JSON.stringify(request));
                } else {
                    addLog('❌ dispatch_request方法不存在', 'error');
                }
                return true;
            } catch (error) {
                addLog(`❌ 发送失败: ${error.message}`, 'error');
                return false;
            }
        }

        // 测试函数
        function testWebChannel() {
            addLog('🔗 开始WebChannel测试...', 'info');
            sendToPython('test_connection', { 
                testType: 'webChannel',
                message: 'WebChannel连接测试'
            });
        }

        function testPerformance() {
            addLog('⚡ 开始性能测试...', 'info');
            const start = performance.now();
            
            for (let i = 0; i < 10; i++) {
                sendToPython('performance_test', {
                    iteration: i,
                    timestamp: Date.now()
                });
            }
            
            const duration = performance.now() - start;
            addLog(`⚡ 性能测试完成: 10次请求耗时 ${duration.toFixed(2)}ms`, 'success');
        }

        function testStorage() {
            addLog('💾 开始存储测试...', 'info');
            
            // 测试localStorage
            try {
                const testData = { test: 'mock_page_storage', timestamp: Date.now() };
                localStorage.setItem('mockTest', JSON.stringify(testData));
                const retrieved = JSON.parse(localStorage.getItem('mockTest'));
                
                if (retrieved.test === testData.test) {
                    addLog('✅ localStorage 测试通过', 'success');
                } else {
                    addLog('❌ localStorage 测试失败', 'error');
                }
            } catch (error) {
                addLog(`❌ localStorage 错误: ${error.message}`, 'error');
            }
            
            // 发送存储测试到后端
            sendToPython('test_storage', {
                testType: 'storage',
                data: { key: 'mock_test', value: 'storage_test_value' }
            });
        }

        function simulateError() {
            addLog('⚠️ 模拟错误处理...', 'warning');
            
            // 发送会导致错误的请求
            sendToPython('simulate_error', {
                errorType: 'intentional',
                message: '这是一个故意的错误测试'
            });
            
            // 本地JavaScript错误
            try {
                throw new Error('Mock JavaScript Error');
            } catch (error) {
                addLog(`❌ 捕获到JavaScript错误: ${error.message}`, 'error');
            }
        }

        function sendCustomMessage() {
            const message = document.getElementById('testMessage').value;
            const type = document.getElementById('testType').value;
            let jsonData = {};
            
            try {
                const jsonText = document.getElementById('jsonData').value;
                if (jsonText.trim()) {
                    jsonData = JSON.parse(jsonText);
                }
            } catch (error) {
                addLog(`❌ JSON解析错误: ${error.message}`, 'error');
                return;
            }
            
            sendToPython('custom_message', {
                testType: type,
                message: message,
                customData: jsonData
            });
        }

        function runAllTests() {
            addLog('🔄 开始运行所有测试...', 'info');
            
            setTimeout(() => testWebChannel(), 100);
            setTimeout(() => testStorage(), 500);
            setTimeout(() => testPerformance(), 1000);
            setTimeout(() => {
                addLog('✅ 所有测试已排队执行', 'success');
            }, 1500);
        }

        // 处理Python发送的消息
        window.handlePythonMessage = function (action, data, requestId) {
            addLog(`📥 收到: ${action} (${requestId})`, 'info');
            
            switch (action) {
                case 'test_response':
                    addLog(`✅ 测试响应: ${data.message || '无消息'}`, 'success');
                    break;
                    
                case 'error_response':
                    addLog(`❌ 错误响应: ${data.error || '未知错误'}`, 'error');
                    break;
                    
                case 'ping':
                    addLog('🏓 收到ping，发送pong', 'info');
                    sendToPython('pong', { originalRequestId: requestId });
                    break;
                    
                default:
                    addLog(`📨 未处理的消息类型: ${action}`, 'warning');
                    console.log('详细数据:', data);
            }
        };

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            addLog('🚀 Mock Test Page 加载完成', 'success');
            
            // 延迟初始化WebChannel
            setTimeout(() => {
                initWebChannel();
            }, 100);
        });

        // 页面可见性API
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                addLog('👁️ 页面隐藏', 'info');
            } else {
                addLog('👁️ 页面可见', 'info');
            }
        });
    </script>
</body>
</html>
