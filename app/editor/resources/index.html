<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="cherry-markdown.css">
    <script src="cherry-markdown.min.js"></script>
    <script src="echarts.min.js"></script>
    <script src="jspdf.umd.min.js"></script>
    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <style>
        body {
            margin: 0px;
            height: 100vh;
            padding: 0;
            box-sizing: border-box;
            /* 修改：移除禁止页面滚动的样式 */
            /* overflow: hidden; 禁止页面滚动 */
            background-color: transparent; /* 新增透明背景 */
        }
        #editor {
            width: calc(100% - 20px);
            height: calc(100vh - 20px);
            margin: 0px;
            /* 修改：移除禁止编辑器滚动的样式 */
            /* overflow: hidden; 禁止编辑器滚动 */
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script>
        // 添加全局错误监听
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('捕获到 JavaScript 错误:');
            console.error('错误信息:', message);
            console.error('错误文件:', source);
            console.error('错误行号:', lineno);
            console.error('错误列号:', colno);
            if (error && error.stack) {
                console.error('错误堆栈:', error.stack);
            }
            // 返回 true 阻止错误默认行为
            return true;
        };

        'use strict';
        var editor = new Cherry({
            id: 'editor',
            value: '',
            toolbars: {
                theme: 'light',
                toolbar: ['bold','italic','strikethrough','|','color','header','ruby','|','list','panel','detail', '|', 'formula', 'image', 'link'],
                //sidebar: [],
                toolbarRight: ['undo', 'redo', 'togglePreview'],
                bubble: false,
                float: []
            },
            // 启用双栏模式
            mode: 'edit&preview',
            preview: {
                // 设置预览区域样式
                style: {
                    height: '100%',
                    width: '100%'
                }
            }
        });

        // 修改为每页 500 行
        var pageSize = 500;
        var currentPage = 1;
        var totalData = []; // 存储全部数据
        var loadedLines = 0; // 记录已加载的行数
        var fileID = '';
        var fileName = '';

        // 定义 updateContent 函数，根据实际需求更新页面内容
        function updateContent(data) {
            if (window.editor) {
                // 将数据拼接成字符串并设置到编辑器中
                var content = data.join('\n');
                window.editor.setValue(content);
            }
        }

        function loadPage(page) {
            var start = (page - 1) * pageSize;
            var end = start + pageSize;
            var pageData = totalData.slice(start, end);
            // 更新页面内容
            updateContent(pageData);
            loadedLines = end > totalData.length ? totalData.length : end;
        }

        // 向上翻页时触发增量加载
        function appendPage() {
            if (loadedLines < totalData.length) {
                currentPage++;
                loadPage(currentPage);
            }
        }

        // 加载前 500 行内容
        function loadFirstPage() {
            currentPage = 1;
            loadPage(currentPage);
        }

        // 在 QWebChannel 接收数据时初始化
        // 确保 QWebChannel 初始化完成
        new QWebChannel(qt.webChannelTransport, function(channel) {
            var document = channel.objects.document;
            document.text_changed.connect(function(text) {
                // 处理加载的更多内容
                console.log('Loaded more content:', text);
                if (window.editor) {
                    window.editor.setValue('');
                }
                window.editor.setValue(text);
            });
        });
    </script>
</body>
</html>
