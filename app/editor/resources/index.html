<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="cherry-markdown.css">
    <script src="cherry-markdown.js"></script>
    <script src="echarts.min.js"></script>
    <script src="jspdf.umd.min.js"></script>
    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <style>
        body {
            margin: 0px;
            height: 100vh;
            padding: 0;
            box-sizing: border-box;
            /* 修改：移除禁止页面滚动的样式 */
            overflow: hidden; /* 禁止页面滚动 */
            background-color: transparent; /* 新增透明背景 */
        }
        #editor {
            width: calc(100% - 20px);
            height: auto;
            /* height: calc(100vh - 20px);*/
            margin: 0px;
            /* 修改：移除禁止编辑器滚动的样式 */
            overflow: hidden; /* 禁止编辑器滚动 */
            /* overflow: hidden; /* 新增：确保元素可滚动 */
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script>
        // 添加全局错误监听
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('捕获到 JavaScript 错误:');
            console.error('错误信息:', message);
            console.error('错误文件:', source);
            console.error('错误行号:', lineno);
            console.error('错误列号:', colno);
            if (error && error.stack) {
                console.error('错误堆栈:', error.stack);
            }
            // 返回 true 阻止错误默认行为
            return true;
        };

        'use strict';
        var editor = new Cherry({
            id: 'editor',
            value: '',
            toolbars: {
                theme: 'light',
                toolbar: [
                    'bold','italic','strikethrough','|',
                    'color','header','ruby','|',
                    'quote','list','panel','detail', 'justify', 'checklist', '|',
                    {insert: ['image', 'audio', 'video', 'link', 'hr', 'br', 'code', 'formula', 'toc', 'table']},
                    'graph'
                ],
                //sidebar: [],
                toolbarRight: ['undo', 'redo', 'togglePreview', 'codeTheme'],
                bubble: false,
                float: ['table', 'code']
            },
            // 启用双栏模式
            mode: 'edit&preview',
            preview: {
                // 设置预览区域样式
                style: {
                    height: 'auto',
                    width: '100%'
                }
            },
            syntax: {              
            },
            header: {
                anchorStyle: 'none',
            }
        });

        // 在 QWebChannel 接收数据时初始化
        // 确保 QWebChannel 初始化完成
        // 在QWebChannel初始化完成后添加
        new QWebChannel(qt.webChannelTransport, function(channel) {
            var document = channel.objects.document;
            console.log('QWebChannel 初始化完成，已获取 document 对象');
            
            // 原有的内容加载逻辑
            document.text_changed.connect(function(text) {
                console.log('收到 text_changed 信号，文本长度: ', text.length);
                if (window.editor) {
                    window.editor.setValue(text);
                }
            });
            
            // 新增：监听编辑器内容变化
            if (window.editor) {
                window.editor.on('change', function() {
                    var currentContent = window.editor.getMarkdown();
                    // 通知Python端内容已变化
                    if (document && document.content_changed) {
                        document.content_changed(currentContent);
                    }
                });
            }
        });
    </script>
</body>
</html>
