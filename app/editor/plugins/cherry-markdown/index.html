<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="./dist/cherry-markdown.min.css">
    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <script src="./webchannel-core.js"></script>
    <script src="./dist/cherry-markdown.min.js"></script>
    <script src="./dist/echarts.min.js"></script>
    <script src="./dist/text-svg.js"></script>
     <style>
        body {
            margin: 0;
            height: 100vh;
            padding: 0;
            box-sizing: border-box;
            border: 5;
            overflow: hidden;
            background-color: transparent;
        }

        #editor {
            width: calc(100% - 20px);
            height: auto;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="editor"></div>
    <script>
        'use strict';
        
        // 页面特定状态管理
        const editorState = {
            editor: null,
            currentDocumentId: null
        };

        // 注册Markdown编辑器特定的消息处理器
        function registerMarkdownHandlers() {
            const WCM = window.WebChannelManager;
            
            WCM.registerMessageHandler('setValue', (data, requestId) => {
                if (editorState.editor) {
                    editorState.editor.setValue(data.content);
                    WCM.logger.info('编辑器内容已更新');
                } else {
                    WCM.logger.error('编辑器未初始化，无法设置内容');
                }
            });

            WCM.registerMessageHandler('setCurrentFileId', (data, requestId) => {
                editorState.currentDocumentId = data.file_id;
                WCM.logger.info('当前文件ID已更新:', data.file_id);
            });

            WCM.registerMessageHandler('textChanged', (data, requestId) => {
                if (editorState.editor) {
                    editorState.editor.setValue(data.content);
                    WCM.logger.info('编辑器内容已更新');
                } else {
                    WCM.logger.error('编辑器未初始化，无法设置内容');
                }
            });

            WCM.registerMessageHandler('getMarkdown', (data, requestId) => {
                if (editorState.editor) {
                    WCM.sendResponseToPython(requestId, {
                        content: editorState.editor.getValue()
                    });
                } else {
                    WCM.sendResponseToPython(requestId, {
                        error: '编辑器未初始化，无法获取Markdown'
                    });
                }
            });

            WCM.registerMessageHandler('registerEditorEvents', (data, requestId) => {
                WCM.logger.debug('注册编辑器事件请求');
            });

            WCM.registerMessageHandler('setupContentChangeListener', (data, requestId) => {
                WCM.logger.debug('设置内容变化监听请求');
            });
        }

        // 响应发送函数（使用WebChannel核心库）
        function sendResponseToPython(requestId, data) {
            window.WebChannelManager.sendResponseToPython(requestId, data);
        }

        // 初始化Cherry Markdown编辑器
        function initEditor() {
            editorState.editor = new Cherry({
                id: 'editor',
                value: '',
                toolbars: {
                    theme: 'light',
                    toolbar: [
                        'bold', 'italic', 'strikethrough', '|',
                        'color', 'header', 'ruby', '|',
                        'quote', 'list', 'panel', 'detail', 'justify', 'checklist', '|',
                        { insert: ['image', 'audio', 'video', 'link', 'hr', 'br', 'code', 'formula', 'toc', 'table'] },
                        'graph'
                    ],
                    toolbarRight: ['undo', 'redo', 'togglePreview', 'codeTheme'],
                    bubble:  ['bold', 'italic', 'underline', 'strikethrough', 'sub', 'sup', 'quote', '|', 'size', 'color'],
                    float: []
                },
                defaultModel: 'editOnly',
                writingStyle: 'typewriter',
                preview: { style: { height: 'auto', width: '100%' } },
                header: { anchorStyle: 'none' }
            });
            
            window.WebChannelManager.logger.info('Cherry Markdown编辑器初始化完成');
        }


        // 初始化WebChannel通信（使用核心库）
        function initWebChannel() {
            return window.WebChannelManager.init('markdown')
                .then(() => {
                    window.WebChannelManager.logger.info('Markdown编辑器WebChannel初始化成功');
                    
                    // 直接注册消息处理器，不再使用onReady
                    registerMarkdownHandlers();
                    
                    // 设置编辑器内容变化监听
                    setupContentChangeListener();
                    
                    // 设置自动保存功能
                    setupAutoSave();
                    
                    window.WebChannelManager.logger.info('Markdown编辑器消息处理器注册完成');
                })
                .catch(error => {
                    window.WebChannelManager.logger.error('Markdown编辑器WebChannel初始化失败:', error);
                });
        }

        // 设置编辑器内容变化监听
        function setupContentChangeListener() {
            if (!editorState.editor) {
                window.WebChannelManager.logger.error('编辑器未初始化，无法设置内容监听');
                return;
            }
            
            // Cherry Markdown编辑器使用不同的事件API
            // 监听编辑器内容变化 - 使用轮询方式监控内容变化
            let lastContent = '';
            setInterval(() => {
                if (editorState.editor) {
                    const currentContent = editorState.editor.getValue();
                    if (currentContent !== lastContent && editorState.currentDocumentId) {
                        lastContent = currentContent;
                        
                        // 发送内容变化通知给后端
                        window.WebChannelManager.sendToPython('contentChanged', {
                            content: currentContent,
                            docId: editorState.currentDocumentId
                        }).catch(error => {
                            window.WebChannelManager.logger.error('发送内容变化通知失败:', error);
                        });
                    }
                }
            }, 1000); // 每秒1秒检查一次
            
            window.WebChannelManager.logger.info('编辑器内容变化监听器已设置');
        }

        // 设置自动保存功能
        function setupAutoSave() {
            setInterval(() => {
                if (editorState.editor && editorState.currentDocumentId) {
                    window.WebChannelManager.sendToPython('autoSave', {
                        content: editorState.editor.getValue(),
                        docId: editorState.currentDocumentId
                    }).catch(error => {
                        window.WebChannelManager.logger.error('自动保存失败:', error);
                    });
                }
            }, 10000);
        }

        // 处理Python发送的消息（由WebChannel核心库统一处理）

        // 处理异步执行结果（使用WebChannel核心库）
        function handleAsyncResponse(requestId, success, data) {
            window.WebChannelManager.logger.debug('处理异步响应:', requestId, success, data);
        }

        // 标准化消息发送（使用WebChannel核心库）
        function sendToPython(action, data = {}, callback = null) {
            // 确保包含文档ID
            const requestData = { 
                ...data, 
                docId: editorState.currentDocumentId || 'default' 
            };
            
            return window.WebChannelManager.sendToPython(action, requestData, callback);
        }

        // 处理Python响应（由WebChannel核心库统一处理）
        function handlePythonResponse(responseJson) {
            // 这个函数保留用于向后兼容，实际处理由核心库完成
            return window.WebChannelManager.handlePythonResponse?.(responseJson);
        }

        // 错误处理（使用WebChannel核心库统一处理）
        // 核心库已经设置了全局错误处理，这里只需要页面特定的错误处理

        // 初始化应用
        function initApp() {
            window.WebChannelManager.logger.info('Markdown编辑器页面开始初始化...');
            
            // 先初始化编辑器
            initEditor();
            
            // 然后初始化WebChannel（这会自动注册消息处理器）
            initWebChannel();
            
            window.WebChannelManager.logger.info('Markdown编辑器页面初始化完成');
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', initApp);
        
        // 确保WebChannel核心库可用时才初始化
        if (window.WebChannelManager) {
            window.WebChannelManager.onReady(function() {
                window.WebChannelManager.logger.info('WebChannel核心库就绪，Markdown编辑器可以开始通信');
            });
        }
    </script>
</body>

</html>
