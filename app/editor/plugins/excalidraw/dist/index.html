<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excalidraw</title>
    <script type="module" crossorigin src="/assets/index-CHaR2bKO.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-ng-qvHpB.css">
  </head>
  <body>
    <div id="root"></div>
    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <script>
      // Excalidraw页面标识
      console.log('🎨 Excalidraw白板页面模板加载中');
      
      // 立即定义handlePythonMessage函数，防止早期调用失败
      window.handlePythonMessage = function(action, data, requestId) {
        console.log('🎨 [Excalidraw Template] 收到Python消息:', action, data, 'requestId:', requestId);
        
        // 兼容性处理：忽略markdown编辑器相关消息
        if (action === 'registerEditorEvents' || action === 'setupContentChangeListener') {
          console.log(`🎨 [Excalidraw Template] 忽略编辑器消息: ${action}`);
          return;
        }
        
        // 检查React应用是否已加载完成
        if (window.webChannelManager) {
          // React应用已加载，传递消息
          if (window.webChannelManager.state && window.webChannelManager.state.messageHandlers.has(action)) {
            try {
              window.webChannelManager.state.messageHandlers.get(action)(data, requestId);
            } catch (error) {
              console.error(`🎨 [Excalidraw Template] 处理消息 ${action} 时出错:`, error);
            }
          } else {
            console.warn(`🎨 [Excalidraw Template] 未注册的消息类型: ${action}`);
          }
        } else {
          // React应用尚未加载，缓存消息
          console.log('🎨 [Excalidraw Template] React应用尚未加载，缓存消息');
          if (!window.pendingExcalidrawMessages) {
            window.pendingExcalidrawMessages = [];
          }
          window.pendingExcalidrawMessages.push({ action, data, requestId });
          
          // 尝试在稍后再次处理
          setTimeout(() => {
            if (window.webChannelManager && window.pendingExcalidrawMessages) {
              console.log(`🎨 [Excalidraw Template] 处理 ${window.pendingExcalidrawMessages.length} 条缓存消息`);
              window.pendingExcalidrawMessages.forEach(msg => {
                window.handlePythonMessage(msg.action, msg.data, msg.requestId);
              });
              window.pendingExcalidrawMessages = [];
            }
          }, 100);
        }
      };
      
      console.log('🎨 [Excalidraw Template] handlePythonMessage函数已定义');
    </script>
  </body>
</html>
