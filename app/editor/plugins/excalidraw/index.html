<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excalidraw</title>
    <!-- 
      关键修复：将qwebchannel.js的加载移到React应用脚本之前。
      这样可以确保在React应用初始化时，QWebChannel对象已经可用。
    -->
    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <script src="./webchannel-core.js"></script>
    <script src="./excalidraw.umd.js"></script>
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 初始化Excalidraw UMD组件
      document.addEventListener('DOMContentLoaded', function() {
        const excalidraw = Excalidraw.createExcalidraw('root');
        window.excalidrawInstance = excalidraw;
        console.log('Excalidraw UMD组件已初始化');
      });
    </script>
  </body>
</html>
