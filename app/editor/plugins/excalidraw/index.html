<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excalidraw</title>
    <!-- 
      关键修复：将qwebchannel.js的加载移到React应用脚本之前。
      这样可以确保在React应用初始化时，QWebChannel对象已经可用。
    -->

    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <script src="./webchannel-core.js"></script>
    <!-- Excalidraw CSS -->
    <link rel="stylesheet" href="./assets/index-aa40c3ce.css">
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
    
    <script>
      // 确保 Excalidraw 使用本地资源而不是 CDN
      // 注意：路径末尾必须包含斜杠
      window.EXCALIDRAW_ASSET_PATH = "./assets/";
      window.EXCALIDRAW_EXPORT_SOURCE = "";
      
      // 初始化WebChannel
      function initWebChannel() {
        if (window.WebChannelManager) {
          window.WebChannelManager.init('excalidraw')
            .then(() => {
              window.WebChannelManager.logger.info('Excalidraw WebChannel初始化成功');
              
              // 注册常用的消息处理器，防止警告
              window.WebChannelManager.registerMessageHandler('setBoardId', (data, requestId) => {
                window.WebChannelManager.logger.info('收到setBoardId消息:', data);
              });
              
              window.WebChannelManager.registerMessageHandler('loadExcalidrawData', (data, requestId) => {
                window.WebChannelManager.logger.info('收到loadExcalidrawData消息:', data);
              });
              
              window.WebChannelManager.registerMessageHandler('saveExcalidrawData', (data, requestId) => {
                window.WebChannelManager.logger.info('收到saveExcalidrawData消息:', data);
              });
              
            })
            .catch(error => {
              window.WebChannelManager.logger.error('Excalidraw WebChannel初始化失败:', error);
            });
        }
      }
      
      // 页面加载完成后初始化WebChannel
      document.addEventListener('DOMContentLoaded', initWebChannel);
    </script>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Excalidraw JS -->
    <script type="module" crossorigin src="./assets/index-2deddb0c.js"></script>
  </body>
</html>
