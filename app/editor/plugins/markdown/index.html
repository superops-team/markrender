<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkRender Markdown Editor</title>

    <link rel="stylesheet" type="text/css" href="./assets/cherry-markdown.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            height: 100vh;
            background: #ffffff;
            overflow: hidden;
        }
        
        #editor {
            width: 100%;
            height: 100%;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">正在加载编辑器...</div>
    <div id="editor" style="display: none;"></div>
    <script src="./assets/echarts.min.js"></script>
    <script src="./assets/jspdf.umd.min.js"></script>
    <script src="./assets/text-svg.js"></script>
    <script src="./assets/cherry-markdown.min.js"></script>

    <script>
        'use strict';
        
        // 增强的全局错误处理
        window.addEventListener('error', function(event) {
            // 更详细地记录错误信息
            const errorInfo = {
                message: event.message,
                filename: event.filename,
                lineno: event.lineno,
                colno: event.colno,
                stack: event.error ? event.error.stack : '无堆栈信息'
            };
            
            console.error('全局错误详情:', JSON.stringify(errorInfo, null, 2));
            
            // 防止错误冒泡
            event.preventDefault();
            return true;
        });
        
        // 处理未捕获的Promise拒绝
        window.addEventListener('unhandledrejection', function(event) {
            console.error('未捕获的Promise拒绝:', {
                reason: event.reason,
                promise: event.promise
            });
            
            // 防止错误冒泡
            event.preventDefault();
            return true;
        });
        
        // 编辑器状态
        window.editorState = {
            editor: null,
            currentItemId: null
        };
        
        // 处理消息的核心函数
        function processMessage(action, data, requestId) {
            try {
                switch(action) {
                    case 'setValue':
                        if (window.editorState.editor) {
                            window.editorState.editor.setValue(data.content || '');
                        }
                        break;
                        
                    case 'getContent':
                        if (window.editorState.editor) {
                            const content = window.editorState.editor.getValue() || '';
                            return content;
                        }
                        break;
                        
                    case 'setCurrentItemId':
                        window.editorState.currentItemId = data.item_id;
                        break;
                        
                    case 'textChanged':
                        if (window.editorState.editor) {
                            console.log('文本变化已处理');
                        }
                        break;
                        
                    case 'registerEditorEvents':
                        // 注册编辑器事件
                        if (window.editorState.editor) {
                            // 注册内容变化事件
                            if (typeof window.editorState.editor.on === 'function') {
                                window.editorState.editor.on('change', function() {
                                    console.log('编辑器内容已变化');
                                });
                            }
                        }
                        break;
                        
                    case 'setupContentChangeListener':
                        // 设置内容变化监听器
                        if (window.editorState.editor) {
                            // 设置内容变化监听
                            if (typeof window.editorState.editor.on === 'function') {
                                window.editorState.editor.on('change', function() {
                                    console.log('检测到内容变化');
                                });
                            }
                        }
                        break;
                        
                    default:
                        console.warn('未知的action类型:', action);
                        break;
                }
            } catch (error) {
                console.error('处理消息时出错:', {
                    action: action,
                    error: error.message,
                    stack: error.stack
                });
            }
        }
        
        // 全局消息处理函数
        window.handleBackendMessage = function(action, data, requestId) {
            console.log('收到后端消息:', action, data);
            try {
                return processMessage(action, data, requestId);
            } catch (error) {
                console.error('处理后端消息时出错:', {
                    action: action,
                    data: data,
                    error: error.message,
                    stack: error.stack
                });
                return null;
            }
        };
        
        // 初始化Cherry编辑器
        function initCherryEditor() {
            if (typeof Cherry === 'undefined') {
                console.error('❌ Cherry Markdown未加载');
                return;
            }
            
            try {
                window.editorState.editor = new Cherry({
                    id: 'editor',
                    value: '',
                    toolbars: {
                        theme: 'light',
                        toolbar: [
                            'bold', 'italic', 'strikethrough', '|',
                            'color', 'header', '|',
                            'quote', 'list', '|',
                            { insert: ['image', 'link', 'code', 'table', 'formula', 'line-table', 'bar-table'] },
                            'graph'
                        ],
                        toolbarRight: ['undo', 'redo', 'togglePreview', 'codeTheme'],
                        bubble:  ['bold', 'italic', 'underline', 'strikethrough', 'sub', 'sup', 'quote', '|', 'size', 'color'],
                        float: []
                    },
                    defaultModel: 'edit&preview',
                    preview: { style: { height: 'auto', width: '100%' } },
                    header: { anchorStyle: 'none' }
                });
                
                console.log('✅ Cherry编辑器初始化成功');
                
                // 设置内容变化监听
                window.editorState.editor.on('change', function() {
                    console.log('内容已变化');
                });
                
                // 隐藏加载，显示编辑器
                document.getElementById('loading').style.display = 'none';
                document.getElementById('editor').style.display = 'block';
                
            } catch (error) {
                console.error('❌ Cherry编辑器初始化失败:', {
                    error: error.message,
                    stack: error.stack
                });
            }
        }
        
        // 启动应用
        document.addEventListener('DOMContentLoaded', function() {
            try {
                initCherryEditor();
            } catch (error) {
                console.error('启动应用时出错:', {
                    error: error.message,
                    stack: error.stack
                });
            }
        });
    </script>
</body>
</html>
