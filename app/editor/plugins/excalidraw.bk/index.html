<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excalidraw</title>
    <!-- 
      关键修复：将qwebchannel.js的加载移到React应用脚本之前。
      这样可以确保在React应用初始化时，QWebChannel对象已经可用。
    -->
    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <script src="./webchannel-core.js"></script>
    
    <!-- Excalidraw CSS -->
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <link rel="modulepreload" crossorigin href="./assets/excalidraw.js">
    <link rel="stylesheet" href="./assets/index.css">
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
    
    <script>
      // 确保 Excalidraw 使用本地资源而不是 CDN
      // 注意：路径末尾必须包含斜杠
      window.EXCALIDRAW_ASSET_PATH = "./assets/";
      window.EXCALIDRAW_EXPORT_SOURCE = "";
    </script>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Excalidraw JS -->
    <script type="module" crossorigin src="./assets/index.js"></script>
  </body>
</html>
